name: Update Citations

on:
  schedule:
    # Runs every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  HUSKY: 0

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch citation counts from OpenAlex
        run: bun run citations:update

      - name: Commit updated citations.yml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/citations.yml
          if git diff --cached --quiet; then
            echo "No changes to citation counts."
          else
            git commit -m "chore: update citation counts [skip ci]"
            git push
          fi
