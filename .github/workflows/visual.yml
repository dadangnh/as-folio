name: Visual regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  visual:
    name: Screenshots and OG images
    # Baselines are for this repository's demo content; forks skip this job.
    if: github.repository == 'dadangnh/as-folio'
    runs-on: ubuntu-latest
    # Keep the image tag in sync with @playwright/test in package.json.
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build:verify

      - name: Visual tests
        run: bunx playwright test -c playwright.visual.config.ts

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
