# oven/bun default tags are Debian-based (glibc), which pagefind's prebuilt binary needs.
image: oven/bun:1.4.3

# ──────────────────────────────────────────────────────────────────────────────
# Override in Settings → CI/CD → Variables:
#   ASTRO_SITE  Full URL of your deployed site, e.g. https://username.gitlab.io
#   ASTRO_BASE  Base path for project pages, e.g. /repo-name
#               Leave unset for user/group pages (username.gitlab.io)
# ──────────────────────────────────────────────────────────────────────────────
variables:
  HUSKY: '0'
  BUN_INSTALL_CACHE_DIR: .bun-cache
  ASTRO_SITE: https://username.gitlab.io
  ASTRO_BASE: /as-folio

stages:
  - validate
  - test
  - build
  - deploy

cache:
  key: '$CI_COMMIT_REF_SLUG'
  paths:
    - .bun-cache/
    - node_modules/

before_script:
  - bun install --frozen-lockfile

typecheck:
  stage: validate
  interruptible: true
  script:
    - bun run test:types

lint:
  stage: validate
  interruptible: true
  script:
    - bun run lint:ci

unit-test:
  stage: test
  interruptible: true
  script:
    - bun run test

build:
  stage: build
  interruptible: true
  # Production mode only for the site build: a global NODE_ENV=production would make
  # installs and unit tests behave like production (e.g. React's production build in vitest).
  variables:
    NODE_ENV: production
  script:
    - bun run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

pages:
  stage: deploy
  needs: [build]
  before_script: []
  script:
    - echo "Publishing dist/ to GitLab Pages"
  pages:
    publish: dist
  artifacts:
    paths:
      - dist
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
